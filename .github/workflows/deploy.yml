
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Publish frontend assets only; accounts and other API features need Node hosting.
      - name: Prepare frontend files
        run: |
          mkdir -p "$RUNNER_TEMP/forma-pages"
          cp index.html favicon.svg "$RUNNER_TEMP/forma-pages/"
          cp -R css js "$RUNNER_TEMP/forma-pages/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/forma-pages

      - id: deployment
        uses: actions/deploy-pages@v4
